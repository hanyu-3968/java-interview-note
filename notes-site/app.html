<!DOCTYPE html>
<html lang="zh-CN" data-default-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Java 面试笔记 · 知识库</title>
<style>
  /* ============ 设计令牌（Ant Design / Tailwind 柔和商务风）============ */
  :root{
    --bg:#f5f7fa;            /* 页面底色：冷灰，护眼 */
    --sidebar-bg:#ffffff;    /* 侧边栏白底 */
    --card-bg:#ffffff;       /* 卡片白底 */
    --text:#1f2937;          /* 主文字：深灰，不用纯黑更柔和 */
    --text-soft:#4b5563;     /* 次要文字 */
    --muted:#9ca3af;         /* 弱化文字 */
    --primary:#2563eb;       /* 主色：商务蓝 */
    --primary-soft:#eff6ff;  /* 主色浅底 */
    --primary-border:#bfdbfe;
    --accent:#7c3aed;        /* 专有名词换色：紫 */
    --highlight:#fef3c7;     /* 核心观点高亮：暖黄 */
    --highlight-text:#92400e;
    --border:#e5e7eb;        /* 边框：浅灰 */
    --shadow-sm:0 1px 2px rgba(0,0,0,.04);
    --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
    --shadow-md:0 4px 6px -1px rgba(0,0,0,.08),0 2px 4px -2px rgba(0,0,0,.04);
    --radius:10px;
    --radius-lg:14px;
  }
  /* ============ 暗色主题（data-theme="dark" 时覆盖）============ */
  [data-theme="dark"]{
    --bg:#0a0a0c;
    --sidebar-bg:rgba(28,28,32,0.85);
    --card-bg:rgba(28,28,32,0.6);
    --text:#f5f5f7;
    --text-soft:#a1a1a6;
    --muted:#6e6e73;
    --primary:#0a84ff;
    --primary-soft:rgba(10,132,255,0.14);
    --primary-border:rgba(10,132,255,0.35);
    --accent:#bf5af2;
    --highlight:rgba(255,159,10,0.28);
    --highlight-text:#ffd89b;
    --border:rgba(255,255,255,0.08);
    --shadow-sm:0 1px 2px rgba(0,0,0,.3);
    --shadow:0 1px 3px rgba(0,0,0,.4),0 1px 2px rgba(0,0,0,.3);
    --shadow-md:0 4px 6px -1px rgba(0,0,0,.5),0 2px 4px -2px rgba(0,0,0,.3);
  }
  [data-theme="dark"] body{background:var(--bg);}
  [data-theme="dark"] .main-header{background:rgba(20,20,24,0.7);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);}
  [data-theme="dark"] .main-header .btn{background:rgba(255,255,255,0.04);color:var(--text-soft);border-color:var(--border);}
  [data-theme="dark"] .main-header .btn:hover{border-color:rgba(255,255,255,0.18);color:var(--text);}
  [data-theme="dark"] .main-header .back-home{background:rgba(255,255,255,0.04);color:var(--text-soft);border-color:var(--border);}
  [data-theme="dark"] .sidebar{background:var(--sidebar-bg);backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);}
  [data-theme="dark"] .sidebar-search input{background:rgba(255,255,255,0.04);color:var(--text);border-color:var(--border);}
  [data-theme="dark"] .tree-item:hover{background:rgba(255,255,255,0.04);}
  [data-theme="dark"] .md-body pre{background:#0d0d10;border:1px solid var(--border);}
  [data-theme="dark"] .md-body table tr:hover td{background:rgba(255,255,255,0.02);}
  [data-theme="dark"] .md-body .mermaid{background:rgba(255,255,255,0.02);border-color:var(--border);}
  [data-theme="dark"] .update-toast{background:rgba(36,36,42,0.92);color:var(--text);border-color:rgba(255,255,255,0.18);box-shadow:0 8px 32px rgba(0,0,0,0.5);}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    font-size:15px;line-height:1.75;
    -webkit-font-smoothing:antialiased;
  }

  /* ============ 整体布局：左侧栏 + 右侧内容 ============ */
  .layout{display:flex;height:100vh;overflow:hidden}
  .sidebar{
    width:280px;flex-shrink:0;background:var(--sidebar-bg);
    border-right:1px solid var(--border);
    display:flex;flex-direction:column;
    box-shadow:var(--shadow-sm);
  }
  .sidebar-header{
    padding:18px 20px;border-bottom:1px solid var(--border);
  }
  .sidebar-header .logo{
    font-size:16px;font-weight:700;color:var(--text);
    display:flex;align-items:center;gap:8px;
  }
  .sidebar-header .logo .dot{
    width:8px;height:8px;border-radius:50%;background:var(--primary);
  }
  .sidebar-header .sub{
    font-size:12px;color:var(--muted);margin-top:4px;
  }
  .sidebar-search{padding:12px 16px;border-bottom:1px solid var(--border)}
  .sidebar-search input{
    width:100%;padding:8px 12px;border:1px solid var(--border);
    border-radius:8px;font-size:13px;background:var(--bg);color:var(--text);
    outline:none;transition:border-color .15s;
  }
  .sidebar-search input:focus{border-color:var(--primary)}
  .tree{flex:1;overflow-y:auto;padding:8px 0}
  .tree::-webkit-scrollbar{width:6px}
  .tree::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:3px}
  .tree-group{margin-bottom:2px}
  .tree-group-title{
    padding:8px 16px;font-size:12px;font-weight:600;color:var(--muted);
    text-transform:uppercase;letter-spacing:.05em;
    display:flex;align-items:center;justify-content:space-between;
    cursor:pointer;user-select:none;
  }
  .tree-group-title:hover{color:var(--text-soft)}
  .tree-group-title .count{
    font-size:11px;background:var(--bg);color:var(--muted);
    padding:1px 7px;border-radius:10px;font-weight:500;
  }
  .tree-item{
    padding:7px 16px 7px 28px;font-size:13.5px;color:var(--text-soft);
    cursor:pointer;border-left:2px solid transparent;
    transition:all .12s;display:flex;align-items:center;gap:6px;
  }
  .tree-item:hover{background:var(--primary-soft);color:var(--text)}
  .tree-item.active{
    background:var(--primary-soft);color:var(--primary);
    border-left-color:var(--primary);font-weight:600;
  }
  .tree-item .icon{font-size:12px;color:var(--muted);flex-shrink:0}
  .tree-item.active .icon{color:var(--primary)}

  /* ============ 右侧主内容区 ============ */
  .main{flex:1;overflow-y:auto;display:flex;flex-direction:column}
  .main-header{
    padding:16px 32px;background:var(--card-bg);
    border-bottom:1px solid var(--border);
    display:flex;align-items:center;justify-content:space-between;
    position:sticky;top:0;z-index:10;box-shadow:var(--shadow-sm);
  }
  .main-header .crumb{font-size:13px;color:var(--muted)}
  .main-header .crumb b{color:var(--text-soft);font-weight:600}
  /* 返回首页按钮 */
  .main-header .back-home{
    display:inline-flex;align-items:center;justify-content:center;
    width:32px;height:32px;border-radius:8px;
    border:1px solid var(--border);background:#fff;color:var(--text-soft);
    text-decoration:none;margin-right:10px;transition:all .15s;flex-shrink:0;
  }
  .main-header .back-home:hover{border-color:var(--primary);color:var(--primary)}
  .main-header .actions{display:flex;gap:8px}
  .main-header .btn{
    padding:6px 12px;font-size:12px;border:1px solid var(--border);
    border-radius:7px;background:#fff;color:var(--text-soft);
    cursor:pointer;transition:all .15s;
  }
  .main-header .btn:hover{border-color:var(--primary);color:var(--primary)}
  .main-header .btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
  /* 检查更新按钮 */
  .main-header .btn-sync{
    display:inline-flex;align-items:center;gap:2px;
    background:var(--primary-soft);border-color:var(--primary-border);
    color:var(--primary);
  }
  .main-header .btn-sync:hover:not(:disabled){
    border-color:var(--primary);color:var(--primary);background:var(--primary-soft);
  }
  .main-header .btn-sync:disabled{opacity:0.6;cursor:wait}
  .sync-spin{
    display:inline-block;width:12px;height:12px;border:2px solid rgba(37,99,235,0.3);
    border-top-color:var(--primary);border-radius:50%;animation:spin 0.7s linear infinite;
    vertical-align:-2px;margin-right:3px;
  }
  /* 更新提示 toast */
  .update-toast{
    position:fixed;top:14px;left:50%;transform:translateX(-50%);
    background:#fff;border:1px solid var(--border);
    color:var(--text);font-size:13px;
    padding:10px 18px;border-radius:100px;z-index:200;
    box-shadow:0 8px 32px rgba(0,0,0,0.12);
    animation:toastIn 0.3s cubic-bezier(0.22,1,0.36,1);
    max-width:90vw;text-align:center;
  }
  @keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

  .content{padding:24px 32px 60px;max-width:900px;width:100%;margin:0 auto}

  /* ============ 笔记头部卡片 ============ */
  .note-head{margin-bottom:20px}
  .note-head .cat-tag{
    display:inline-block;font-size:12px;font-weight:600;
    color:var(--primary);background:var(--primary-soft);
    border:1px solid var(--primary-border);
    padding:3px 12px;border-radius:12px;margin-bottom:10px;
  }
  .note-head h1{
    font-size:24px;font-weight:700;color:var(--text);
    margin-bottom:8px;letter-spacing:-.01em;
  }
  .note-head .summary{
    font-size:14px;color:var(--text-soft);line-height:1.6;
  }
  .note-head .tags{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}
  .note-head .tag{
    font-size:11px;color:var(--text-soft);background:var(--bg);
    padding:2px 8px;border-radius:6px;border:1px solid var(--border);
  }

  /* ============ Markdown 渲染卡片式 ============ */
  .md-body h1{
    font-size:20px;font-weight:700;margin:28px 0 12px;
    padding-bottom:8px;border-bottom:2px solid var(--border);color:var(--text);
  }
  .md-body h2{
    font-size:17px;font-weight:700;margin:24px 0 10px;color:var(--text);
    padding:8px 14px;background:var(--primary-soft);
    border-left:4px solid var(--primary);border-radius:0 8px 8px 0;
  }
  .md-body h3{font-size:15px;font-weight:600;margin:18px 0 8px;color:var(--text)}
  .md-body h4{font-size:14px;font-weight:600;margin:14px 0 6px;color:var(--text-soft)}
  .md-body p{margin:10px 0;color:var(--text)}
  .md-body ul,.md-body ol{margin:10px 0;padding-left:24px}
  .md-body li{margin:5px 0}
  /* 核心观点加粗：高亮暖黄底 */
  .md-body strong{
    font-weight:700;color:var(--text);
    background:linear-gradient(transparent 60%,var(--highlight) 60%);
    padding:0 2px;
  }
  .md-body em{font-style:italic;color:var(--text-soft)}
  /* 专有名词：用 code 样式但紫色 */
  .md-body code{
    background:#f3f0ff;color:var(--accent);
    padding:1px 6px;border-radius:4px;font-size:13px;
    font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
    font-weight:600;
  }
  .md-body pre{
    background:#1e293b;color:#e2e8f0;padding:14px 18px;
    border-radius:var(--radius);overflow:auto;margin:14px 0;
    font-size:13px;line-height:1.6;
  }
  .md-body pre code{background:none;color:inherit;padding:0;font-weight:400}
  .md-body blockquote{
    margin:14px 0;padding:12px 18px;background:var(--primary-soft);
    border-left:4px solid var(--primary);border-radius:0 var(--radius) var(--radius) 0;
    color:var(--text-soft);
  }
  .md-body blockquote p{margin:6px 0}
  /* 表格：卡片式带圆角 */
  .md-body table{
    width:100%;border-collapse:separate;border-spacing:0;
    margin:16px 0;font-size:13.5px;
    border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;
    display:block;overflow-x:auto;
  }
  .md-body th{
    background:#f9fafb;font-weight:600;color:var(--text);
    padding:10px 14px;text-align:left;border-bottom:1px solid var(--border);
  }
  .md-body td{
    padding:10px 14px;border-bottom:1px solid var(--border);color:var(--text-soft);
    vertical-align:top;
  }
  .md-body tr:last-child td{border-bottom:none}
  .md-body tr:hover td{background:#fafbfc}
  .md-body hr{border:none;border-top:1px solid var(--border);margin:24px 0}
  .md-body a{color:var(--primary);text-decoration:none;border-bottom:1px solid transparent}
  .md-body a:hover{border-bottom-color:var(--primary)}
  /* Mermaid 图表卡片 */
  .md-body .mermaid{
    margin:18px 0;text-align:center;background:#fafbfc;
    border:1px solid var(--border);border-radius:var(--radius-lg);
    padding:18px;box-shadow:var(--shadow);overflow:auto;
  }
  .md-body .mermaid svg{max-width:100%;height:auto}
  .md-body .mermaid-error{
    color:var(--muted);font-size:13px;padding:20px;text-align:center;
  }

  /* ============ 加载/空状态 ============ */
  .loading-state{
    text-align:center;padding:80px 20px;color:var(--muted);font-size:14px;
  }
  .loading-state .spinner{
    width:32px;height:32px;border:3px solid var(--border);
    border-top-color:var(--primary);border-radius:50%;
    margin:0 auto 14px;animation:spin 0.8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ============ 移动端：侧边栏可折叠 ============ */
  .menu-toggle{display:none}
  @media(max-width:768px){
    .sidebar{
      position:fixed;left:0;top:0;bottom:0;z-index:100;
      transform:translateX(-100%);transition:transform .25s;
    }
    .sidebar.open{transform:translateX(0)}
    .menu-toggle{
      display:inline-flex;align-items:center;justify-content:center;
      width:36px;height:36px;border:1px solid var(--border);border-radius:8px;
      background:#fff;cursor:pointer;margin-right:10px;
    }
    .content{padding:16px}
    .main-header{padding:12px 16px}
  }
</style>
</head>
<body>
<div id="app"></div>

<script src="lib/vue.global.prod.js"></script>
<script src="lib/marked.min.js"></script>
<script src="lib/mermaid.min.js"></script>
<script src="updater.js"></script>
<script src="theme.js"></script>
<script src="settings-panel.js"></script>
<script>
const { createApp, ref, computed, watch, onMounted, nextTick } = Vue;

createApp({
  setup(){
    // ============ 数据 ============
    const notes = ref([]);              // notes.json 元数据
    const currentId = ref(null);        // 当前选中笔记 id
    const currentMd = ref('');          // 当前笔记 md 原文
    const loading = ref(true);
    const loadingMd = ref(false);
    const searchKey = ref('');
    const collapsed = ref({});          // 分组折叠状态
    const sidebarOpen = ref(false);     // 移动端侧边栏
    const fontSize = ref('mid');        // 字号 small/mid/large
    const mermaidCounter = ref(0);

    // ============ 更新相关 ============
    const updating = ref(false);
    const updateMsg = ref('');
    const lastVersion = ref('');

    function loadVersion(){
      try {
        const m = window.NoteUpdater ? NoteUpdater.getActiveManifest() : null;
        if (m && m.version) lastVersion.value = m.version;
      } catch(e){}
    }

    async function checkUpdate(){
      if(!window.NoteUpdater){ updateMsg.value = '当前环境不支持更新'; return; }
      if(updating.value) return;
      updating.value = true;
      updateMsg.value = '正在检查更新…';
      try {
        const res = await NoteUpdater.sync();
        if(res.updated){
          updateMsg.value = '已更新到最新（' + res.newFiles.length + ' 篇新笔记）';
          Object.keys(mdCache).forEach(k => delete mdCache[k]);
          await loadNotes();
          loadVersion();
        } else {
          updateMsg.value = '已是最新版本';
          loadVersion();
        }
      } catch(e){
        updateMsg.value = '更新失败：' + (e.message || '请检查网络');
      } finally {
        updating.value = false;
        setTimeout(()=>{ updateMsg.value = ''; }, 3000);
      }
    }

    // ============ 计算属性 ============
    // 按分类分组的树 —— 排除 AI 分类（AI 笔记归 ai-app.html 分区）
    const groupedTree = computed(()=>{
      const map = {};
      notes.value.forEach(n => {
        if(n.category === 'AI') return;
        if(searchKey.value){
          const k = searchKey.value.toLowerCase();
          if(!n.title.toLowerCase().includes(k) && !n.id.toLowerCase().includes(k)
             && !(n.tags||[]).join('').toLowerCase().includes(k)) return;
        }
        if(!map[n.category]) map[n.category] = [];
        map[n.category].push(n);
      });
      return Object.keys(map).sort().map(cat => ({ category:cat, items:map[cat] }));
    });

    const currentNote = computed(()=> notes.value.find(n => n.id === currentId.value));

    // AI 分类的笔记数（用于侧边栏副标题排除计数）
    const aiCount = computed(()=> notes.value.filter(n => n.category === 'AI').length);

    // ============ 方法 ============
    async function loadNotes(){
      try{
        // 用 NoteUpdater 读取（优先缓存，支持离线更新）
        const data = window.NoteUpdater
          ? await NoteUpdater.readJSON('notes.json')
          : await fetch('notes.json').then(r=>r.json());
        notes.value = data;
        if(notes.value.length > 0){
          // 默认选中第一篇非 AI 笔记（AI 笔记归 ai-app.html 分区）
          const firstNonAi = data.find(n => n.category !== 'AI') || data[0];
          // 先关闭 loading，让 #md-content 容器进入 DOM，再加载笔记
          loading.value = false;
          await selectNote(firstNonAi.id);
        } else {
          loading.value = false;
        }
      }catch(e){
        console.error('加载 notes.json 失败', e);
        loading.value = false;
      }
    }

    const mdCache = {};
    async function selectNote(id){
      if(currentId.value === id && currentMd.value) return;
      currentId.value = id;
      loadingMd.value = true;
      sidebarOpen.value = false;
      try{
        if(!mdCache[id]){
          // 用 NoteUpdater 读取（优先缓存）
          mdCache[id] = window.NoteUpdater
            ? await NoteUpdater.read('notes/' + id + '.md')
            : await fetch('notes/' + id + '.md').then(r=>r.text());
        }
        currentMd.value = mdCache[id];
        await nextTick();
        renderMd();
      }catch(e){
        console.error('加载笔记失败', e);
        currentMd.value = '# 加载失败\n\n>' + e.message;
      }finally{
        loadingMd.value = false;
      }
    }

    // 渲染 markdown + mermaid
    function renderMd(){
      const el = document.getElementById('md-content');
      if(!el){
        // #md-content 尚未挂载（v-if 切换时序），下一帧重试
        requestAnimationFrame(renderMd);
        return;
      }
      const mdText = currentMd.value;
      // 提取 mermaid 块，用占位符替换
      const mermaidBlocks = [];
      const placeholder = mdText.replace(/```mermaid\r?\n([\s\S]*?)```/g, (m, code) => {
        mermaidBlocks.push(code.trim());
        return '@@MERMAID_' + (mermaidBlocks.length - 1) + '@@';
      });
      // marked 渲染
      let html = window.marked ? marked.parse(placeholder) : '<pre>' + placeholder + '</pre>';
      // 替换占位符为 mermaid 容器
      html = html.replace(/@@MERMAID_(\d+)@@/g, (m, idx) => {
        return '<div class="mermaid" data-idx="' + idx + '">' + mermaidBlocks[parseInt(idx)] + '</div>';
      });
      el.innerHTML = html;
      // 渲染 mermaid
      if(window.mermaid){
        mermaid.initialize({ startOnLoad:false, theme:'default', securityLevel:'loose', flowchart:{ useMaxWidth:true } });
        el.querySelectorAll('.mermaid').forEach(div => {
          const code = div.textContent;
          const renderId = 'mm-svg-' + (mermaidCounter.value++);
          mermaid.render(renderId, code).then(({svg}) => {
            div.innerHTML = svg;
          }).catch(e => {
            div.innerHTML = '<div class="mermaid-error">流程图渲染失败：' + e.message + '</div>';
          });
        });
      }
    }

    function toggleGroup(cat){
      collapsed.value[cat] = !collapsed.value[cat];
    }
    function isCollapsed(cat){
      return collapsed.value[cat] === true;
    }
    function toggleSidebar(){ sidebarOpen.value = !sidebarOpen.value; }
    function setFontSize(s){ fontSize.value = s; }

    // ============ 生命周期 ============
    onMounted(async ()=>{
      // 等 updater 初始化，但加 2 秒超时保护
      if(window.NoteUpdater && NoteUpdater._initPromise){
        try {
          await Promise.race([
            NoteUpdater._initPromise,
            new Promise((_,reject)=> setTimeout(()=>reject(new Error('timeout')), 2000))
          ]);
        } catch(e){}
      }
      loadVersion();
      loadNotes();
    });

    return {
      notes, currentId, currentMd, loading, loadingMd, searchKey,
      groupedTree, currentNote, collapsed, sidebarOpen, fontSize,
      selectNote, toggleGroup, isCollapsed, toggleSidebar, setFontSize,
      updating, updateMsg, lastVersion, checkUpdate, aiCount
    };
  },
  template: `
