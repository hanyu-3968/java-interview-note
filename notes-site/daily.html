<!DOCTYPE html>
<html lang="zh-CN" data-default-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#000000">
<title>每日笔记 · Notes</title>
<style>
  /* ============ 设计令牌（与首页统一的苹果深色质感）============ */
  :root{
    --bg-0:#000000;
    --bg-1:#0a0a0c;
    --glass:rgba(28,28,32,0.55);
    --glass-strong:rgba(36,36,42,0.78);
    --glass-border:rgba(255,255,255,0.10);
    --glass-border-strong:rgba(255,255,255,0.18);
    --text:#f5f5f7;
    --text-soft:#a1a1a6;
    --text-muted:#6e6e73;
    --glow-orange:#ff9f0a;
    --glow-pink:#ff375f;
    --glow-blue:#0a84ff;
    --accent:#ff9f0a;
    --accent-soft:rgba(255,159,10,0.14);
    --accent-border:rgba(255,159,10,0.35);
    --border:rgba(255,255,255,0.08);
    --radius:18px;
    --radius-lg:24px;
    /* md 渲染色（深色适配）*/
    --md-bg:rgba(20,20,24,0.6);
    --md-h2-bg:rgba(255,159,10,0.10);
    --md-code-bg:rgba(191,90,242,0.14);
    --md-code-text:#c997ff;
    --md-pre-bg:#0d0d10;
    --md-quote-bg:rgba(10,132,255,0.10);
    --md-th-bg:rgba(255,255,255,0.05);
    --md-highlight:rgba(255,159,10,0.28);
    --md-highlight-text:#ffd89b;
    --md-link:#0a84ff;
  }
  /* ============ 亮色主题（data-theme="light" 时覆盖）============ */
  [data-theme="light"]{
    --bg-0:#f5f7fa;
    --bg-1:#ffffff;
    --glass:rgba(255,255,255,0.75);
    --glass-strong:rgba(255,255,255,0.92);
    --glass-border:rgba(0,0,0,0.08);
    --glass-border-strong:rgba(0,0,0,0.15);
    --text:#1f2937;
    --text-soft:#4b5563;
    --text-muted:#9ca3af;
    --accent:#2563eb;
    --accent-soft:#eff6ff;
    --accent-border:#bfdbfe;
    --border:#e5e7eb;
    --md-bg:#ffffff;
    --md-h2-bg:#eff6ff;
    --md-code-bg:#f3f0ff;
    --md-code-text:#7c3aed;
    --md-pre-bg:#1e293b;
    --md-quote-bg:#eff6ff;
    --md-th-bg:#f9fafb;
    --md-highlight:#fef3c7;
    --md-highlight-text:#92400e;
    --md-link:#2563eb;
  }
  [data-theme="light"] .bg-aurora{display:none}
  [data-theme="light"] .md-body pre{color:#e2e8f0}
  [data-theme="light"] .md-body pre code{color:#e2e8f0}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:var(--bg-0);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;
    font-size:15px;line-height:1.75;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    overflow:hidden;
  }

  /* ============ 背景光晕 ============ */
  .bg-aurora{
    position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  }
  .bg-aurora::before,.bg-aurora::after{
    content:"";position:absolute;border-radius:50%;filter:blur(140px);
    opacity:0.4;will-change:transform;
  }
  .bg-aurora::before{
    width:620px;height:620px;
    background:radial-gradient(circle,#7c2d12 0%,#ff9f0a 40%,transparent 70%);
    top:-180px;right:-160px;
    animation:float1 20s ease-in-out infinite;
  }
  .bg-aurora::after{
    width:560px;height:560px;
    background:radial-gradient(circle,#581c87 0%,#bf5af2 40%,transparent 70%);
    bottom:-200px;left:-180px;
    animation:float2 24s ease-in-out infinite;
  }
  @keyframes float1{
    0%,100%{transform:translate(0,0) scale(1)}
    50%{transform:translate(-40px,30px) scale(1.08)}
  }
  @keyframes float2{
    0%,100%{transform:translate(0,0) scale(1)}
    50%{transform:translate(40px,-20px) scale(1.1)}
  }

  /* ============ 布局 ============ */
  .layout{
    position:relative;z-index:2;
    display:flex;height:100vh;overflow:hidden;
  }

  /* ============ 侧边栏 ============ */
  .sidebar{
    width:300px;flex-shrink:0;
    background:var(--glass);
    backdrop-filter:blur(40px) saturate(180%);
    -webkit-backdrop-filter:blur(40px) saturate(180%);
    border-right:1px solid var(--border);
    display:flex;flex-direction:column;
  }
  .sidebar-header{
    padding:20px 22px 16px;
    border-bottom:1px solid var(--border);
  }
  .back-link{
    display:inline-flex;align-items:center;gap:6px;
    font-size:12px;color:var(--text-muted);
    text-decoration:none;margin-bottom:14px;
    transition:color 0.2s;
  }
  .back-link:hover{color:var(--text-soft)}
  .back-link svg{width:14px;height:14px}
  .logo{
    font-size:17px;font-weight:600;color:var(--text);
    display:flex;align-items:center;gap:10px;
    letter-spacing:-0.01em;
    filter:drop-shadow(0 0 12px rgba(255,159,10,0.3));
  }
  .logo .dot{
    width:8px;height:8px;border-radius:50%;
    background:linear-gradient(135deg,#ff9f0a,#ff375f);
    box-shadow:0 0 10px rgba(255,159,10,0.6);
  }
  .logo-sub{
    font-size:12px;color:var(--text-muted);margin-top:6px;
  }
  .sidebar-search{padding:14px 18px;border-bottom:1px solid var(--border)}
  .sidebar-search input{
    width:100%;padding:9px 14px;
    border:1px solid var(--border);border-radius:100px;
    font-size:13px;background:rgba(255,255,255,0.04);color:var(--text);
    outline:none;transition:all 0.2s;
  }
  .sidebar-search input::placeholder{color:var(--text-muted)}
  .sidebar-search input:focus{
    border-color:var(--accent-border);
    background:rgba(255,255,255,0.06);
  }

  .tree{flex:1;overflow-y:auto;padding:12px 0}
  .tree::-webkit-scrollbar{width:6px}
  .tree::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:3px}
  .tree::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.2)}

  .tree-group{margin-bottom:6px}
  .tree-group-title{
    padding:8px 22px;font-size:11px;font-weight:600;
    color:var(--text-muted);text-transform:uppercase;letter-spacing:0.08em;
    display:flex;align-items:center;justify-content:space-between;
    cursor:pointer;user-select:none;
    transition:color 0.2s;
  }
  .tree-group-title:hover{color:var(--text-soft)}
  .tree-group-title .count{
    font-size:10px;background:rgba(255,255,255,0.06);
    color:var(--text-muted);padding:2px 8px;border-radius:100px;font-weight:500;
  }
  .tree-item{
    padding:10px 22px 10px 30px;font-size:13.5px;color:var(--text-soft);
    cursor:pointer;border-left:2px solid transparent;
    transition:all 0.18s;display:flex;flex-direction:column;gap:3px;
  }
  .tree-item:hover{
    background:rgba(255,255,255,0.04);color:var(--text);
  }
  .tree-item.active{
    background:var(--accent-soft);color:var(--accent);
    border-left-color:var(--accent);font-weight:600;
  }
  .tree-item .ti-title{font-size:13.5px;line-height:1.3}
  .tree-item .ti-date{font-size:11px;color:var(--text-muted);font-weight:400}
  .tree-item.active .ti-date{color:var(--accent);opacity:0.8}

  /* ============ 主内容区 ============ */
  .main{flex:1;overflow-y:auto;display:flex;flex-direction:column}
  .main::-webkit-scrollbar{width:8px}
  .main::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:4px}

  .main-header{
    padding:14px 32px;
    background:var(--glass);
    backdrop-filter:blur(30px) saturate(180%);
    -webkit-backdrop-filter:blur(30px) saturate(180%);
    border-bottom:1px solid var(--border);
    display:flex;align-items:center;justify-content:space-between;
    position:sticky;top:0;z-index:10;
  }
  .crumb{font-size:13px;color:var(--text-muted);display:flex;align-items:center;gap:8px}
  .crumb b{color:var(--text-soft);font-weight:600}
  .crumb .sep{opacity:0.4}
  /* 返回首页按钮 */
  .main-header .back-home{
    display:inline-flex;align-items:center;justify-content:center;
    width:32px;height:32px;border-radius:9px;
    border:1px solid var(--border);background:rgba(255,255,255,0.04);color:var(--text-soft);
    text-decoration:none;margin-right:10px;transition:all .2s;flex-shrink:0;
  }
  .main-header .back-home:hover{border-color:var(--glass-border-strong);color:var(--text)}
  .menu-toggle{display:none}
  .actions{display:flex;gap:6px;align-items:center}
  .btn{
    padding:6px 13px;font-size:12px;
    border:1px solid var(--border);border-radius:100px;
    background:rgba(255,255,255,0.04);color:var(--text-soft);
    cursor:pointer;transition:all 0.2s;font-family:inherit;
  }
  .btn:hover{border-color:var(--glass-border-strong);color:var(--text)}
  .btn.active{
    background:linear-gradient(135deg,#ff9f0a,#ff375f);
    color:#fff;border-color:transparent;
    box-shadow:0 0 16px rgba(255,159,10,0.4);
  }
  /* 检查更新按钮 */
  .btn-sync{
    display:inline-flex;align-items:center;gap:2px;
    background:rgba(255,159,10,0.10);border-color:rgba(255,159,10,0.35);
    color:#ff9f0a;
  }
  .btn-sync:hover:not(:disabled){
    background:rgba(255,159,10,0.18);color:#ff9f0a;border-color:rgba(255,159,10,0.5);
  }
  .btn-sync:disabled{opacity:0.6;cursor:wait}
  .sync-spin{
    display:inline-block;width:12px;height:12px;border:2px solid rgba(255,159,10,0.3);
    border-top-color:#ff9f0a;border-radius:50%;animation:spin 0.7s linear infinite;
    vertical-align:-2px;margin-right:3px;
  }
  /* 更新提示 toast */
  .update-toast{
    position:fixed;top:14px;left:50%;transform:translateX(-50%);
    background:rgba(36,36,42,0.92);backdrop-filter:blur(20px);
    border:1px solid var(--glass-border-strong);
    color:var(--text);font-size:13px;
    padding:10px 18px;border-radius:100px;z-index:200;
    box-shadow:0 8px 32px rgba(0,0,0,0.5);
    animation:toastIn 0.3s cubic-bezier(0.22,1,0.36,1);
    max-width:90vw;text-align:center;
  }
  @keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

  .content{padding:28px 32px 80px;max-width:920px;width:100%;margin:0 auto}

  /* 笔记头部 */
  .note-head{margin-bottom:24px;animation:fadeUp 0.5s cubic-bezier(0.22,1,0.36,1) both}
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  .note-head .date-tag{
    display:inline-flex;align-items:center;gap:6px;
    font-size:12px;font-weight:600;color:var(--accent);
    background:var(--accent-soft);border:1px solid var(--accent-border);
    padding:4px 12px;border-radius:100px;margin-bottom:12px;
  }
  .note-head .date-tag svg{width:12px;height:12px}
  .note-head h1{
    font-size:26px;font-weight:700;color:var(--text);
    margin-bottom:8px;letter-spacing:-0.02em;
    filter:drop-shadow(0 0 16px rgba(255,255,255,0.08));
  }
  .note-head .summary{
    font-size:14px;color:var(--text-soft);line-height:1.6;
  }
  .note-head .tags{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px}
  .note-head .tag{
    font-size:11px;color:var(--text-soft);
    background:rgba(255,255,255,0.05);
    padding:3px 10px;border-radius:100px;
    border:1px solid var(--border);
  }

  /* ============ Markdown 渲染（深色质感）============ */
  .md-body h1{
    font-size:22px;font-weight:700;margin:32px 0 14px;
    padding-bottom:10px;border-bottom:1px solid var(--border);color:var(--text);
    letter-spacing:-0.01em;
  }
  .md-body h2{
    font-size:18px;font-weight:600;margin:28px 0 12px;color:var(--text);
    padding:10px 16px;background:var(--md-h2-bg);
    border-left:4px solid var(--accent);border-radius:0 var(--radius) var(--radius) 0;
    letter-spacing:-0.01em;
  }
  .md-body h3{font-size:16px;font-weight:600;margin:20px 0 10px;color:var(--text)}
  .md-body h4{font-size:14px;font-weight:600;margin:16px 0 8px;color:var(--text-soft)}
  .md-body p{margin:12px 0;color:var(--text);line-height:1.8}
  .md-body ul,.md-body ol{margin:12px 0;padding-left:24px}
  .md-body li{margin:6px 0;color:var(--text)}
  .md-body strong{
    font-weight:700;color:var(--md-highlight-text);
    background:linear-gradient(transparent 60%,var(--md-highlight) 60%);
    padding:0 3px;
  }
  .md-body em{font-style:italic;color:var(--text-soft)}
  .md-body code{
    background:var(--md-code-bg);color:var(--md-code-text);
    padding:2px 7px;border-radius:6px;font-size:13px;
    font-family:"SF Mono",SFMono-Regular,Consolas,"Liberation Mono",monospace;
    font-weight:500;
  }
  .md-body pre{
    background:var(--md-pre-bg);color:#e2e8f0;
    padding:16px 20px;border-radius:var(--radius);
    border:1px solid var(--border);overflow:auto;margin:16px 0;
    font-size:13px;line-height:1.65;
  }
  .md-body pre code{background:none;color:inherit;padding:0;font-weight:400;font-size:13px}
  .md-body blockquote{
    margin:16px 0;padding:14px 20px;background:var(--md-quote-bg);
    border-left:4px solid var(--glow-blue);
    border-radius:0 var(--radius) var(--radius) 0;
    color:var(--text-soft);
  }
  .md-body blockquote p{margin:8px 0}
  .md-body table{
    width:100%;border-collapse:separate;border-spacing:0;
    margin:18px 0;font-size:13.5px;
    border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;
    display:block;overflow-x:auto;
  }
  .md-body th{
    background:var(--md-th-bg);font-weight:600;color:var(--text);
    padding:11px 15px;text-align:left;border-bottom:1px solid var(--border);
  }
  .md-body td{
    padding:11px 15px;border-bottom:1px solid var(--border);
    color:var(--text-soft);vertical-align:top;
  }
  .md-body tr:last-child td{border-bottom:none}
  .md-body tr:hover td{background:rgba(255,255,255,0.02)}
  .md-body hr{border:none;border-top:1px solid var(--border);margin:28px 0}
  .md-body a{
    color:var(--md-link);text-decoration:none;
    border-bottom:1px solid transparent;
  }
  .md-body a:hover{border-bottom-color:var(--md-link)}
  .md-body .mermaid{
    margin:20px 0;text-align:center;
    background:rgba(255,255,255,0.02);
    border:1px solid var(--border);border-radius:var(--radius-lg);
    padding:20px;overflow:auto;
  }
  .md-body .mermaid svg{max-width:100%;height:auto}
  .md-body .mermaid-error{
    color:var(--text-muted);font-size:13px;padding:24px;text-align:center;
  }

  /* ============ 加载/空状态 ============ */
  .loading-state{
    text-align:center;padding:100px 20px;color:var(--text-muted);font-size:14px;
  }
  .loading-state .spinner{
    width:36px;height:36px;border:2px solid var(--border);
    border-top-color:var(--accent);border-radius:50%;
    margin:0 auto 16px;animation:spin 0.8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .empty-state{
    text-align:center;padding:80px 20px;color:var(--text-muted);
  }
  .empty-state .icon{
    font-size:48px;margin-bottom:16px;opacity:0.3;
  }

  /* ============ 移动端 ============ */
  @media(max-width:768px){
    .sidebar{
      position:fixed;left:0;top:0;bottom:0;z-index:100;
      transform:translateX(-100%);transition:transform 0.3s cubic-bezier(0.22,1,0.36,1);
    }
    .sidebar.open{transform:translateX(0)}
    .menu-toggle{
      display:inline-flex;align-items:center;justify-content:center;
      width:36px;height:36px;border:1px solid var(--border);border-radius:10px;
      background:rgba(255,255,255,0.04);cursor:pointer;margin-right:10px;
      color:var(--text-soft);
    }
    .content{padding:20px 16px 60px}
    .main-header{padding:12px 16px}
    .note-head h1{font-size:22px}
  }
</style>
</head>
<body>
  <div class="bg-aurora"></div>
  <div id="app"></div>
  <!-- 全局错误兜底：JS 报错时显示，而不是白屏 -->
  <div id="fatal-error" style="display:none;position:fixed;inset:0;z-index:9999;background:#000;color:#ff6b6b;padding:40px 20px;font-family:monospace;font-size:13px;overflow:auto">
    <h3 style="color:#fff;margin-bottom:16px">页面加载出错</h3>
    <pre id="fatal-error-msg"></pre>
    <p style="color:#888;margin-top:20px">请截图发给我排查。也可尝试 <a href="index.html" style="color:#0a84ff">返回首页</a>。</p>
  </div>
  <script>
    window.addEventListener('error', function(e){
      var box = document.getElementById('fatal-error');
      var msg = document.getElementById('fatal-error-msg');
      if(box && msg){
        msg.textContent += '[ERROR] ' + (e.message || '未知错误') + (e.filename ? '\n  at ' + e.filename + ':' + e.lineno : '') + '\n\n';
        box.style.display = 'block';
      }
    });
    window.addEventListener('unhandledrejection', function(e){
      var box = document.getElementById('fatal-error');
      var msg = document.getElementById('fatal-error-msg');
      if(box && msg){
        msg.textContent += '[PROMISE] ' + (e.reason && e.reason.message ? e.reason.message : e.reason) + '\n\n';
        box.style.display = 'block';
      }
    });
  </script>

<script src="lib/vue.global.prod.js"></script>
<script src="lib/marked.min.js"></script>
<script src="lib/mermaid.min.js"></script>
<script src="updater.js"></script>
<script src="theme.js"></script>
<script src="settings-panel.js"></script>
<script>
const { createApp, ref, computed, watch, onMounted, nextTick } = Vue;

createApp({
  setup(){
    const notes = ref([]);
    const currentId = ref(null);
    const currentMd = ref('');
    const loading = ref(true);
    const loadingMd = ref(false);
    const searchKey = ref('');
    const collapsed = ref({});
    const sidebarOpen = ref(false);
    const fontSize = ref('mid');
    const mermaidCounter = ref(0);

    // ============ 更新相关 ============
    const updating = ref(false);
    const updateMsg = ref('');
    const lastVersion = ref('');

    function loadVersion(){
      try {
        const m = window.NoteUpdater ? NoteUpdater.getActiveManifest() : null;
        if (m && m.version) lastVersion.value = m.version;
      } catch(e){}
    }

    async function checkUpdate(){
      if(!window.NoteUpdater){ updateMsg.value = '当前环境不支持更新'; return; }
      if(updating.value) return;
      updating.value = true;
      updateMsg.value = '正在检查更新…';
      try {
        const res = await NoteUpdater.sync();
        if(res.updated){
          updateMsg.value = '已更新到最新（' + (res.newFiles.length) + ' 篇新笔记）';
          // 重新加载笔记列表和当前笔记（清空缓存）
          Object.keys(mdCache).forEach(k => delete mdCache[k]);
          await loadNotes();
          loadVersion();
        } else {
          updateMsg.value = '已是最新版本';
          loadVersion();
        }
      } catch(e){
        updateMsg.value = '更新失败：' + (e.message || '请检查网络');
      } finally {
        updating.value = false;
        // 3 秒后清空提示
        setTimeout(()=>{ updateMsg.value = ''; }, 3000);
      }
    }

    // 按年-月分组
    const groupedTree = computed(()=>{
      const map = {};
      notes.value.forEach(n => {
        if(searchKey.value){
          const k = searchKey.value.toLowerCase();
          if(!n.title.toLowerCase().includes(k) && !n.date.toLowerCase().includes(k)
             && !(n.tags||[]).join('').toLowerCase().includes(k)) return;
        }
        // date: 2026-11-05 → 分组键 2026-11
        const ym = (n.date || '').slice(0,7);
        if(!ym) return;
        if(!map[ym]) map[ym] = [];
        map[ym].push(n);
      });
      // 年-月降序，组内日期降序
      return Object.keys(map).sort().reverse().map(ym => ({
        ym,
        items: map[ym].sort((a,b)=> (a.date < b.date ? 1 : -1))
      }));
    });

    const currentNote = computed(()=> notes.value.find(n => n.id === currentId.value));

    async function loadNotes(){
      try{
        // 用 NoteUpdater 读取（优先缓存，支持离线更新）
        const data = window.NoteUpdater
          ? await NoteUpdater.readJSON('daily.json')
          : await fetch('daily.json').then(r=>r.json());
        notes.value = data;
        if(notes.value.length > 0){
          // 默认选最新一天：按 date 降序取第一个
          const sorted = [...notes.value].sort((a,b)=> (a.date < b.date ? 1 : -1));
          // 先关闭 loading，让 #md-content 容器进入 DOM，再加载并渲染笔记
          loading.value = false;
          await selectNote(sorted[0].id);
        } else {
          loading.value = false;
        }
      }catch(e){
        console.error('加载 daily.json 失败', e);
        loading.value = false;
      }
    }

    const mdCache = {};
    async function selectNote(id){
      if(currentId.value === id && currentMd.value) return;
      currentId.value = id;
      loadingMd.value = true;
      sidebarOpen.value = false;
      try{
        if(!mdCache[id]){
          // 用 NoteUpdater 读取（优先缓存）
          mdCache[id] = window.NoteUpdater
            ? await NoteUpdater.read('notes/daily/' + id + '.md')
            : await fetch('notes/daily/' + id + '.md').then(r=>r.text());
        }
        currentMd.value = mdCache[id];
        await nextTick();
        renderMd();
      }catch(e){
        console.error('加载笔记失败', e);
        var msg = (e && e.message) ? e.message : String(e);
        currentMd.value =
          '## ⚠️ 笔记正文加载失败\n\n' +
          '> 原因：`' + msg + '`\n>\n' +
          '> 路径：`notes/daily/' + id + '.md`';
        await nextTick();
        renderMd();
      }finally{
        loadingMd.value = false;
      }
    }

    function renderMd(){
      const el = document.getElementById('md-content');
      if(!el){
        // #md-content 尚未挂载（v-if 切换时序），下一帧重试
        requestAnimationFrame(renderMd);
        return;
      }
      const mdText = currentMd.value;
      const mermaidBlocks = [];
      const placeholder = mdText.replace(/```mermaid\r?\n([\s\S]*?)```/g, (m, code) => {
        mermaidBlocks.push(code.trim());
        return '@@MERMAID_' + (mermaidBlocks.length - 1) + '@@';
      });
      let html = window.marked ? marked.parse(placeholder) : '<pre>' + placeholder + '</pre>';
      html = html.replace(/@@MERMAID_(\d+)@@/g, (m, idx) => {
        return '<div class="mermaid" data-idx="' + idx + '">' + mermaidBlocks[parseInt(idx)] + '</div>';
      });
      el.innerHTML = html;
      if(window.mermaid){
        mermaid.initialize({ startOnLoad:false, theme:'dark', securityLevel:'loose', flowchart:{ useMaxWidth:true } });
        el.querySelectorAll('.mermaid').forEach(div => {
          const code = div.textContent;
          const renderId = 'mm-svg-' + (mermaidCounter.value++);
          mermaid.render(renderId, code).then(({svg}) => {
            div.innerHTML = svg;
          }).catch(e => {
            div.innerHTML = '<div class="mermaid-error">流程图渲染失败：' + e.message + '</div>';
          });
        });
      }
    }

    function toggleGroup(ym){ collapsed.value[ym] = !collapsed.value[ym]; }
    function isCollapsed(ym){ return collapsed.value[ym] === true; }
    function toggleSidebar(){ sidebarOpen.value = !sidebarOpen.value; }
    function setFontSize(s){ fontSize.value = s; }
    function goHome(){ window.location.href = 'index.html'; }

    // 格式化日期展示
    function fmtDate(d){
      if(!d) return '';
      const parts = d.split('-');
      if(parts.length < 3) return d;
      return parts[1] + '月' + parts[2] + '日';
    }
    function fmtWeekday(d){
      if(!d) return '';
      const dt = new Date(d + 'T00:00:00');
      const wd = ['周日','周一','周二','周三','周四','周五','周六'];
      return wd[dt.getDay()];
    }

    onMounted(async ()=>{
      // 等 updater 初始化，但加 2 秒超时保护，避免卡死在 loading
      if(window.NoteUpdater && NoteUpdater._initPromise){
        try {
          await Promise.race([
            NoteUpdater._initPromise,
            new Promise((_,reject)=> setTimeout(()=>reject(new Error('timeout')), 2000))
          ]);
        } catch(e){ /* 超时或失败，用默认 manifest 继续 */ }
      }
      loadVersion();
      loadNotes();
    });

    return {
      notes, currentId, currentMd, loading, loadingMd, searchKey,
      groupedTree, currentNote, collapsed, sidebarOpen, fontSize,
      selectNote, toggleGroup, isCollapsed, toggleSidebar, setFontSize, goHome,
      fmtDate, fmtWeekday,
      updating, updateMsg, lastVersion, checkUpdate
    };
  },
  template: `
  <div class="layout">
    <!-- 侧边栏 -->
    <aside class="sidebar" :class="{open:sidebarOpen}">
      <div class="sidebar-header">
        <a class="back-link" href="index.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          返回首页
        </a>
        <div class="logo"><span class="dot"></span>每日笔记</div>
        <div class="logo-sub">共 {{ notes.length }} 篇 · 按日期分组</div>
      </div>
      <div class="sidebar-search">
        <input v-model="searchKey" placeholder="搜索标题或标签…" />
      </div>
      <nav class="tree">
        <div v-if="loading" class="loading-state" style="padding:40px 20px">
          <div class="spinner"></div>加载中…
        </div>
        <div v-else-if="groupedTree.length === 0" class="loading-state" style="padding:40px 20px">
          未找到匹配笔记
        </div>
        <template v-else>
          <div class="tree-group" v-for="g in groupedTree" :key="g.ym">
            <div class="tree-group-title" @click="toggleGroup(g.ym)">
              <span>{{ g.ym }}</span>
              <span class="count">{{ g.items.length }}</span>
            </div>
            <template v-if="!isCollapsed(g.ym)">
              <div v-for="n in g.items" :key="n.id"
                   class="tree-item" :class="{active: n.id === currentId}"
                   @click="selectNote(n.id)">
                <span class="ti-title">{{ n.title }}</span>
                <span class="ti-date">{{ fmtDate(n.date) }} · {{ fmtWeekday(n.date) }}</span>
              </div>
            </template>
          </div>
        </template>
      </nav>
    </aside>

    <!-- 主内容 -->
    <main class="main">
      <div class="main-header">
        <div style="display:flex;align-items:center">
          <button class="menu-toggle" @click="toggleSidebar">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <a href="index.html" class="back-home" title="返回首页">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          </a>
          <div class="crumb">
            <b>每日笔记</b>
            <span class="sep">/</span>
            <span v-if="currentNote">{{ currentNote.date }}</span>
            <span class="sep" v-if="currentNote">/</span>
            <span v-if="currentNote">{{ currentNote.title }}</span>
          </div>
        </div>
        <div class="actions">
          <button class="btn btn-sync" :disabled="updating" @click="checkUpdate" :title="lastVersion ? ('当前版本 '+lastVersion) : '检查更新'">
            <svg v-if="!updating" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:3px"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
            <span v-if="updating" class="sync-spin"></span>
            {{ updating ? '更新中' : '更新' }}
          </button>
          <button class="btn" :class="{active:fontSize==='small'}" @click="setFontSize('small')">小</button>
          <button class="btn" :class="{active:fontSize==='mid'}" @click="setFontSize('mid')">中</button>
          <button class="btn" :class="{active:fontSize==='large'}" @click="setFontSize('large')">大</button>
        </div>
        <div v-if="updateMsg" class="update-toast">{{ updateMsg }}</div>
      </div>

      <div class="content" :style="{fontSize: 'calc(' + (fontSize==='small'?'14px':fontSize==='large'?'17px':'15px') + ' * var(--font-scale, 1))'}">
        <div v-if="loading" class="loading-state">
          <div class="spinner"></div>加载笔记中…
        </div>
        <template v-else-if="currentNote">
          <div class="note-head">
            <span class="date-tag">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
              {{ currentNote.date }} · {{ fmtWeekday(currentNote.date) }}
            </span>
            <h1>{{ currentNote.title }}</h1>
            <div class="summary">{{ currentNote.summary }}</div>
            <div class="tags" v-if="currentNote.tags && currentNote.tags.length">
              <span class="tag" v-for="t in currentNote.tags" :key="t">{{ t }}</span>
            </div>
          </div>
          <div class="md-body" id="md-content"></div>
        </template>
        <div v-else class="empty-state">
          <div class="icon">📅</div>
          <div>暂无每日笔记</div>
        </div>
      </div>
    </main>
  </div>
  `
}).mount('#app');
</script>
</body>
</html>
